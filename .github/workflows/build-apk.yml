name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Android Gradle Project
        run: |
          python3 - << 'PYEOF'
          import pathlib, zipfile, shutil

          for z in pathlib.Path(".").rglob("*.zip"):
              with zipfile.ZipFile(z, "r") as zf:
                  zf.extractall(".")

          for sg in pathlib.Path(".").rglob("settings.gradle"):
              if sg.parent != pathlib.Path("."):
                  for item in sg.parent.iterdir():
                      if not pathlib.Path(item.name).exists():
                          shutil.move(str(item), ".")
                  break

          pathlib.Path("app/src/main/java/com/shiguangxu/k80").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)

          if not pathlib.Path("app/src/main/assets/index.html").exists():
              htmls = [p for p in pathlib.Path(".").rglob("*.html") if "build" not in p.parts]
              if htmls:
                  shutil.copy(str(htmls[0]), "app/src/main/assets/index.html")
              else:
                  pathlib.Path("app/src/main/assets/index.html").write_text(
                      "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head><body><h2>时光序 · 番茄日历</h2></body></html>",
                      encoding="utf-8"
                  )

          if not pathlib.Path("settings.gradle").exists():
              pathlib.Path("settings.gradle").write_text(
                  "pluginManagement {\n  repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories { google(); mavenCentral() }\n}\nrootProject.name = \"K80FocusCalendar\"\ninclude \":app\"\n",
                  encoding="utf-8"
              )

          if not pathlib.Path("build.gradle").exists():
              pathlib.Path("build.gradle").write_text(
                  "plugins {\n  id \"com.android.application\" version \"8.2.2\" apply false\n}\n",
                  encoding="utf-8"
              )

          if not pathlib.Path("gradle.properties").exists():
              pathlib.Path("gradle.properties").write_text(
                  "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n",
                  encoding="utf-8"
              )

          if not pathlib.Path("app/build.gradle").exists():
              pathlib.Path("app/build.gradle").write_text(
                  "plugins { id \"com.android.application\" }\nandroid {\n  namespace \"com.shiguangxu.k80\"\n  compileSdk 34\n  defaultConfig {\n    applicationId \"com.shiguangxu.k80\"\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName \"1.0.0\"\n  }\n  buildTypes {\n    release { minifyEnabled false; signingConfig signingConfigs.debug }\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n}\n",
                  encoding="utf-8"
              )

          if not pathlib.Path("app/src/main/AndroidManifest.xml").exists():
              pathlib.Path("app/src/main/AndroidManifest.xml").write_text(
                  "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.shiguangxu.k80\">\n  <uses-permission android:name=\"android.permission.VIBRATE\" />\n  <application android:allowBackup=\"true\" android:label=\"时光序·番茄日历\" android:hardwareAccelerated=\"true\" android:usesCleartextTraffic=\"true\" android:theme=\"@android:style/Theme.DeviceDefault.NoActionBar\">\n    <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n",
                  encoding="utf-8"
              )

          if not pathlib.Path("app/src/main/java/com/shiguangxu/k80/MainActivity.java").exists():
              pathlib.Path("app/src/main/java/com/shiguangxu/k80/MainActivity.java").write_text(
                  "package com.shiguangxu.k80;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.view.Window;\nimport android.webkit.*;\npublic class MainActivity extends Activity {\n  private WebView w;\n  @Override protected void onCreate(Bundle b) {\n    super.onCreate(b);\n    requestWindowFeature(Window.FEATURE_NO_TITLE);\n    w = new WebView(this);\n    WebSettings s = w.getSettings();\n    s.setJavaScriptEnabled(true);\n    s.setDomStorageEnabled(true);\n    s.setDatabaseEnabled(true);\n    s.setAllowFileAccess(true);\n    w.setWebViewClient(new WebViewClient());\n    w.setWebChromeClient(new WebChromeClient());\n    w.loadUrl(\"file:///android_asset/index.html\");\n    setContentView(w);\n  }\n  @Override public void onBackPressed() {\n    if (w != null && w.canGoBack()) w.goBack();\n    else super.onBackPressed();\n  }\n}\n",
                  encoding="utf-8"
              )
          PYEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-K80-Focus-Calendar-APK
          path: app/build/outputs/apk/**/*.apk
